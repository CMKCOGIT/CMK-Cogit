<!DOCTYPE html>
<!-- Arte da og:image da Black (1200x630). Gerar: Edge/Chrome headless com --screenshot e --window-size=1200,630. -->
<html lang="pt-BR"><head><meta charset="UTF-8"><title>OG Black da Cogit</title>
<style>
@font-face { font-family: 'Clash Display'; src: url('../assets/fonts/clash-display-500.woff2') format('woff2'); font-weight: 500; }
@font-face { font-family: 'Satoshi'; src: url('../assets/fonts/satoshi-700.woff2') format('woff2'); font-weight: 700; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #121314; }
.og { box-sizing: border-box; position: absolute; inset: 40px; border: 2px solid #F3F3F1; padding: 52px 56px; display: grid; grid-template-rows: auto 1fr auto; color: #F3F3F1; }
.rot { font: 700 22px/1 'Satoshi', sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #8EA6D8; }
h1 { margin: 34px 0 0; font: 500 96px/.95 'Clash Display', sans-serif; letter-spacing: -.03em; }
.pe { display: flex; justify-content: space-between; align-items: end; border-top: 2px solid #F3F3F1; padding-top: 26px; }
.pe p { margin: 0; font: 700 26px/1.3 'Satoshi', sans-serif; }
.pe b { font: 700 22px/1 'Satoshi', sans-serif; letter-spacing: .16em; text-transform: uppercase; background: #F3F3F1; color: #121314; padding: 12px 14px; }
</style></head>
<body><div class="og"><span class="rot">Black da Cogit · 26 e 27/11</span><h1>Black Friday<br>da Cogit.</h1><div class="pe"><p>Sites, landing pages e portfólios<br>com até 25% de desconto de verdade.</p><b>CMK COGIT</b></div></div></body></html>
